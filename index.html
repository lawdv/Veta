<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111b">
  <title>Veta · minería espacial</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07111b;color:#dce8f3;font:16px system-ui,sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    #status{max-width:560px;text-align:center;line-height:1.6}
    #status strong{display:block;font-size:1.2rem;margin-bottom:8px}
    #status small{color:#91a8bb}
  </style>
</head>
<body>
  <div id="status"><strong>Veta · minería espacial</strong>Preparando el campo de exploración…<br><small>Descargando recursos del juego.</small></div>
  <script>
    (async () => {
      const files = [
        "game.part00.txt","game.part01.txt","game.part02.txt",
        "game.part03.txt","game.part04.txt","game.part05.txt"
      ];
      try {
        const pieces = await Promise.all(files.map(async file => {
          const response = await fetch("./assets/" + file, {cache:"no-store"});
          if (!response.ok) throw new Error("No se pudo cargar " + file + " (" + response.status + ")");
          return response.text();
        }));
        const base64 = pieces.join("").replace(/\s/g, "");
        const binary = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
        if (!("DecompressionStream" in window)) {
          throw new Error("Este navegador no admite la descompresión requerida. Prueba con una versión reciente de Chrome, Edge, Firefox o Safari.");
        }
        const stream = new Blob([binary]).stream().pipeThrough(new DecompressionStream("gzip"));
        const gameHtml = await new Response(stream).text();
        document.open();
        document.write(gameHtml);
        document.close();
      } catch (error) {
        console.error(error);
        document.getElementById("status").innerHTML =
          "<strong>No se pudo iniciar Veta</strong>" +
          "<small>" + String(error.message || error) + "</small>";
      }
    })();
  </script>
</body>
</html>
